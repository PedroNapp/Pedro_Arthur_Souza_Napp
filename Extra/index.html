<!DOCTYPE html>
<html lang="pt-BR">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Gerenciador de Tarefas Acadêmicas</title>
   <link rel="stylesheet" href="styles.css">
</head>

<body>
   
   
   <div class="clima" id="clima" aria-hidden="true">
      <div class="chuva"></div>
      <div class="neblina"></div>
      <div class="relampago"></div>
   </div>
<!-- Sistema de clima -->

   <header>
      <h1>Gerenciador de Tarefas Acadêmicas</h1>

      <!-- Caixa do horário e clima -->
      <div class="painel-status">

         <!-- Ciclo de dia e noite -->
         <div class="ciclo-dia-noite">

               <div class="ciclo-orbita">
                  <div class="terra">🌍</div>
                  <div class="ciclo-astro"></div>
               </div>

               <div class="ciclo-info">
                  <span class="ciclo-hora"></span>
                  <span class="ciclo-periodo"></span>
               </div>

         </div>

         <!-- Seletor de clima -->
         <div class="seletor-clima">

               <label for="selecao-clima">Clima</label>

               <select id="selecao-clima">
                  <option value="">Sem clima</option>
                  <option value="chuva">🌧️ Chuva</option>
                  <option value="neblina">🌫️ Neblina</option>
                  <option value="tempestade">⛈️ Tempestade</option>
               </select>

         </div>

      </div>
   </header>

   <main>

      
      <section aria-labelledby="titulo-filtros">
         <h2 id="titulo-filtros">Busca e filtros</h2>

         <form>

            <!-- Busca -->
            <div class="campo-busca">
                  <label for="busca">Buscar tarefa por título:</label>
                  <input
                     type="search"
                     id="busca"
                     name="busca"
                     placeholder="Digite o título da tarefa..."
                  >
            </div>

            <!-- Caixa de filtros -->
            <div class="caixas-filtros">

                  <div class="caixa-filtro">
                     <label for="status">Filtrar por status:</label>

                     <select id="status" name="status">
                        <option value="todos">Todos</option>
                        <option value="a-fazer">A fazer</option>
                        <option value="em-andamento">Em andamento</option>
                        <option value="em-revisao">Em revisão</option>
                        <option value="concluida">Concluída</option>
                     </select>
                  </div>

                  <div class="caixa-filtro">
                     <label for="prioridade">Filtrar por prioridade:</label>

                     <select id="prioridade" name="prioridade">
                        <option value="todas">Todas</option>
                        <option value="baixa">Baixa</option>
                        <option value="media">Média</option>
                        <option value="alta">Alta</option>
                     </select>
                  </div>

            </div>

            <!-- Botões -->
            <div class="botoes-filtros">
                  <button type="submit">Aplicar filtros</button>

                  <button type="button" id="limpar-filtros">Limpar filtros </button>
            </div>

         </form>
      </section>


      <!-- Região para informar os estados da aplicação -->
      <div class="status-aplicacao" role="status" aria-live="polite"  data-status></div>


      <section class="quadro" aria-labelledby="titulo-quadro" data-quadro>

         <h2 id="titulo-quadro">Quadro de tarefas</h2>


         <!-- A FAZER -->
         <section class="coluna-a-fazer" aria-labelledby="titulo-a-fazer">

            <h3 id="titulo-a-fazer">A fazer</h3>

            <ul data-lista-status="a-fazer"></ul>

         </section>


         <!-- EM ANDAMENTO -->
         <section class="coluna-andamento" aria-labelledby="titulo-andamento">

            <h3 id="titulo-andamento">Em andamento</h3>

            <ul data-lista-status="em-andamento"></ul>

         </section>


         <!-- EM REVISÃO -->
         <section class="coluna-revisao" aria-labelledby="titulo-revisao">

            <h3 id="titulo-revisao">Em revisão</h3>

            <ul data-lista-status="em-revisao"></ul>

         </section>


         <!-- CONCLUÍDA -->
         <section class="coluna-concluida" aria-labelledby="titulo-concluida">

            <h3 id="titulo-concluida">Concluída</h3>

            <ul data-lista-status="concluida"></ul>

         </section>

      </section>

   </main>


   <footer>

      <p>Pedro Arthur Souza Napp</p>

      <p>Disciplina: Desenvolvimento Frontend — 2026.2</p>

   </footer>


   <script type="module" src="./js/app.js"></script>

</body>

</html>
